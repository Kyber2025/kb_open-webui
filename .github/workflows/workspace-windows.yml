name: SSH workspace Windows setup
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/open_webui/resources/workspace/kividas-ssh-setup.*'
      - 'kividas-web/scripts/test-workspace-windows.ps1'
      - '.github/workflows/workspace-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v5
      - name: Test Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./kividas-web/scripts/test-workspace-windows.ps1 -RequireWindows
      - name: Test PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./kividas-web/scripts/test-workspace-windows.ps1 -RequireWindows
